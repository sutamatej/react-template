# Installs dependencies and runs all checks (typecheck, translations, tests, lint)
# on every Node.js LTS release line - keep in sync with "engines" in package.json.
# See the Node.js release schedule at https://nodejs.org/en/about/previous-releases

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run validate
